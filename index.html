<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Video Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>My Playlist</h3>
      <div class="video-item" data-video-id="M7lc1UVf-VE">Video Title 1</div>
      <div class="video-item" data-video-id="dQw4w9WgXcQ">Video Title 2</div>
    </div>
    <div class="sidebar-section">
      <h3>Another Section</h3>
      <div class="video-item" data-video-id="9bZkp7q19f0">Video Title 3</div>
    </div>
  </div>

  <!-- Main Content (Video Player) -->
  <div class="main-content">
    <div class="video-wrapper">
      <!-- YouTube player will be placed here -->
      <iframe id="player" src="" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
