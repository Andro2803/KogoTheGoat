<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kogo Leaderboard</title>
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- favicon links -->
  <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <style>
    /* force sidebar to be on the left, full height */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    /* video wrapper: 16:9 responsive */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 0.75rem;
      background: #0a0a0a;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      border: 0;
    }
    /* sidebar item hover + active */
    .video-item {
      transition: background 0.15s, color 0.15s;
      border-radius: 0.5rem;
      cursor: pointer;
    }
    .video-item:hover {
      background: #2a2a2a;
      color: #ffffff;
    }
    .video-item.active {
      background: #3a3a3a;
      color: #facc15;
      font-weight: 500;
    }
    /* custom scrollbar for sidebar */
    .sidebar-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .sidebar-scroll::-webkit-scrollbar-track {
      background: #1a1a1a;
    }
    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- FLEX CONTAINER: sidebar on the left, main content on the right -->
  <div class="flex h-screen w-full overflow-hidden bg-[#0e0e0e]">

    <!-- SIDEBAR (left) -->
    <aside class="w-72 flex-shrink-0 bg-[#1a1a1a] flex flex-col border-r border-[#2a2a2a] h-full">
      <!-- title -->
      <div class="px-4 py-3 border-b border-[#2a2a2a]">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-300">
          Any % leaderboard
        </h2>
      </div>
      <!-- list -->
      <div class="flex-1 overflow-y-auto px-3 py-3 sidebar-scroll">
        <div class="space-y-1">
          <!-- items with data-video-id, first one active -->
          <div class="video-item active px-3 py-2.5 text-sm flex items-center justify-between text-gray-300" data-video-id="0GuAM6tdsok">
            <span>00:29 Perfect</span>
            <span class="text-yellow-400 text-xs font-medium">👑</span>
          </div>
          <div class="video-item px-3 py-2.5 text-sm flex items-center justify-between text-gray-300" data-video-id="0G4ucwMuKyg">
            <span>00:36 Attempt</span>
            <span class="text-gray-400 text-xs">🥈</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT (right) -->
    <main class="flex-1 flex flex-col bg-[#0e0e0e] p-6 md:p-8 overflow-y-auto h-full">
      <!-- header -->
      <div class="flex items-center justify-center mb-6">
        <h1 class="text-5xl md:text-6xl font-bold text-white tracking-tight flex items-center gap-3">
          <span>🐐</span> Kogo Speedruns
        </h1>
      </div>

      <!-- video player -->
      <div class="max-w-4xl w-full mx-auto flex-1 flex flex-col">
        <div class="mt-3 text-sm text-gray-400 flex justify-center items-center px-1 py-6">
          <span id="video-title" class="text-2xl md:text-3xl font-semibold text-gray-200">00:29 Perfect 👑</span>
        </div>
        <div class="video-wrapper shadow-2xl shadow-black/50">
          <!-- using the exact YouTube embed code you provided -->
          <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/0GuAM6tdsok?si=xmodjj3soN9M5Stt" 
          title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; 
          gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
          </iframe>
        </div>
      </div>

      <!-- footer -->
      <div class="mt-auto pt-4 text-center text-[10px] text-gray-600 border-t border-[#1a1a1a] mt-8">
        <span> WIP Footer 👍</span>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
